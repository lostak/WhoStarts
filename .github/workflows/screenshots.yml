name: Store screenshots

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - "app/src/androidTest/**"
      - ".github/workflows/screenshots.yml"
  workflow_dispatch: {}

jobs:
  screenshots:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: phone
            profile: pixel_2
          - name: tablet-7in
            profile: Nexus 7 2013
          - name: tablet-10in
            profile: pixel_tablet
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Gradle wrapper
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.11.1
          fi
          chmod +x gradlew

      - name: Build app and test APKs
        run: ./gradlew assembleFreeDebug assembleFreeDebugAndroidTest

      - name: Capture on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: ${{ matrix.profile }}
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            adb install -r app/build/outputs/apk/free/debug/app-free-debug.apk
            adb install -r app/build/outputs/apk/androidTest/free/debug/app-free-debug-androidTest.apk
            adb shell settings put global sysui_demo_allowed 1
            adb shell am broadcast -a com.android.systemui.demo -e command enter
            adb shell am broadcast -a com.android.systemui.demo -e command clock -e hhmm 2130
            adb shell am broadcast -a com.android.systemui.demo -e command battery -e level 100 -e plugged false
            adb shell am broadcast -a com.android.systemui.demo -e command network -e wifi show -e level 4 -e mobile show -e datatype none -e level 4
            adb shell am broadcast -a com.android.systemui.demo -e command notifications -e visible false
            adb shell am instrument -w -e class com.example.pooltracker.StoreScreenshots com.lostak.whostarts.test/androidx.test.runner.AndroidJUnitRunner
            mkdir -p screens
            adb pull /sdcard/Android/data/com.lostak.whostarts/files/screens/. screens/
            ls -la screens

      - name: Pad to exact 16:9 / 9:16
        run: |
          pip install --quiet pillow
          python3 tools/pad_screenshots.py screens

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: store-screenshots-${{ matrix.name }}
          path: screens/

      - name: Commit screenshots to repo
        run: |
          mkdir -p store/screenshots/${{ matrix.name }}
          cp screens/*.png store/screenshots/${{ matrix.name }}/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add store/screenshots
          git commit -m "Update store screenshots [skip ci]" || exit 0
          for i in 1 2 3 4 5; do
            git pull --rebase origin ${{ github.ref_name }} && git push origin HEAD:${{ github.ref_name }} && break
            sleep $((i * 5))
          done
