name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.11.1
          fi
          chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: pool-tracker-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Decode signing key
        if: ${{ env.SIGNING_PASSWORD != '' }}
        run: openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in signing/upload.jks.enc -out "$RUNNER_TEMP/upload.jks" -pass env:SIGNING_PASSWORD

      - name: Build signed release bundle
        if: ${{ env.SIGNING_PASSWORD != '' }}
        env:
          SIGNING_KEYSTORE_PATH: ${{ runner.temp }}/upload.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          SIGNING_KEY_ALIAS: upload
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: ./gradlew bundleRelease

      - name: Upload release bundle
        if: ${{ env.SIGNING_PASSWORD != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: whostarts-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
